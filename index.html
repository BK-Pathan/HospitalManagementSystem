<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vitalis — Smart Hospital Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.js"></script>
<style>
.hero-image{
    --cut-size:120px;

    position:relative;
    width:500px;
    border-radius:32px;
    overflow:visible;
}

.hero-image img{
    display:block;
    width:100%;
    border-radius:32px;
}

/* Concave Cut */
.hero-image::before{
    content:"";
    position:absolute;

    width:var(--cut-size);
    height:var(--cut-size);

    border-radius:50%;
    background:#fff;        /* page background */

    top:0;
    right:0;

    transform:translate(50%,-50%);
    z-index:2;
}

/* Circular Card */
.stats-card{

    width:var(--cut-size);
    height:var(--cut-size);

    position:absolute;

    top:0;
    right:0;
    bottom:-13;

    transform:translate(50%,-50%);

    border-radius:50%;

    background:#00b894;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:#fff;

    z-index:3;

    box-shadow:0 20px 50px rgba(0,0,0,.18);
   
    backdrop-filter: blur(16px);
    background: rgba(14,165,165,.95);
    border:6px solid white;
    box-shadow:
        0 25px 60px rgba(0,0,0,.18),
        inset 0 1px 1px rgba(255,255,255,.4);
}
</style>
</head>

<div class="hero-image">

      <img src="https://i.pinimg.com/736x/50/01/6a/50016a8c9ef67cd3dbf61f9097cbf942.jpg" alt="Doctor">

    <div class="stats-card">
        <h3>22</h3>
        <p>Doctors</p>

</div>

<script>
const { createApp, ref, reactive, onMounted, onBeforeUnmount } = Vue;

createApp({
  setup(){
    const scrolled = ref(false);
    const menuOpen = ref(false);
    const heartRate = ref(72);

    const stats = reactive({ hospitals: 500, patients: 2, uptime: 99.9 });

    const patients = [
      { name:'Ethan Cole', room:'Room 214 · Cardiology', status:'Stable', initials:'EC', color:'linear-gradient(135deg,#4c8dff,#22d3ee)' },
      { name:'Maria Alonso', room:'Room 108 · Ortho', status:'Review', initials:'MA', color:'linear-gradient(135deg,#ffb37c,#ff7a90)' },
      { name:'Kenji Watanabe', room:'ICU 3 · Post-op', status:'Stable', initials:'KW', color:'linear-gradient(135deg,#79e8fb,#2e6ff2)' },
    ];

    const bars = [45, 62, 38, 80, 55, 70, 48];

    const refs = {
      rotor: ref(null), blobA: ref(null), blobB: ref(null), blobC: ref(null),
      iconField: ref(null), stage: ref(null), mainPanel: ref(null),
      fcDoctor: ref(null), fcNotif: ref(null), fcHeart: ref(null),
    };

    let mouseX = 0, mouseY = 0, curX = 0, curY = 0, scrollY = 0, rafId = null;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function onScroll(){
      scrolled.value = window.scrollY > 12;
      scrollY = window.scrollY;
    }
    function onMouseMove(e){
      mouseX = (e.clientX / window.innerWidth) - 0.5;
      mouseY = (e.clientY / window.innerHeight) - 0.5;
    }

    function tick(){
      curX += (mouseX - curX) * 0.06;
      curY += (mouseY - curY) * 0.06;

      if (refs.rotor.value) refs.rotor.value.style.transform = `translate3d(0,0,0) rotate(${scrollY * 0.03 + curX * 6}deg)`;
      if (refs.blobA.value) refs.blobA.value.style.transform = `translate3d(${curX*30 - scrollY*0.04}px, ${curY*24 + scrollY*0.08}px,0)`;
      if (refs.blobB.value) refs.blobB.value.style.transform = `translate3d(${curX*-26 + scrollY*0.03}px, ${curY*20 + scrollY*0.05}px,0)`;
      if (refs.blobC.value) refs.blobC.value.style.transform = `translate3d(${curX*20}px, ${curY*-18 - scrollY*0.06}px,0)`;

      if (refs.stage.value) {
        const rx = (curY * -10);
        const ry = (curX * 14);
        refs.stage.value.style.transform = `translateY(${scrollY*0.12}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
      }
      if (refs.mainPanel.value) refs.mainPanel.value.style.transform = `translate3d(${curX*8}px, ${curY*8 - scrollY*0.02}px, 40px)`;
      if (refs.fcDoctor.value) refs.fcDoctor.value.style.transform = `translate3d(${curX*22}px, ${curY*16 - scrollY*0.16}px, 90px)`;
      if (refs.fcNotif.value) refs.fcNotif.value.style.transform = `translate3d(${curX*-18}px, ${curY*-14 + scrollY*0.1}px, 70px)`;
      if (refs.fcHeart.value) refs.fcHeart.value.style.transform = `translate3d(${curX*16}px, ${curY*-10 - scrollY*0.14}px, 100px)`;

      if (refs.iconField.value) {
        refs.iconField.value.style.transform = `translate3d(${curX*-10}px, ${curY*-8 + scrollY*0.15}px,0)`;
      }

      rafId = requestAnimationFrame(tick);
    }

    let hrInterval = null;

    onMounted(() => {
      onScroll();
      window.addEventListener('scroll', onScroll, { passive:true });
      if (!reduceMotion){
        window.addEventListener('mousemove', onMouseMove);
        rafId = requestAnimationFrame(tick);
        hrInterval = setInterval(() => { heartRate.value = 68 + Math.round(Math.random()*8); }, 1800);
      }
      initParticles(refs);
    });

    onBeforeUnmount(() => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('mousemove', onMouseMove);
      if (rafId) cancelAnimationFrame(rafId);
      if (hrInterval) clearInterval(hrInterval);
    });

    return { scrolled, menuOpen, heartRate, stats, patients, bars, ...refs };
  }
}).mount('#app');

/* ---------- lightweight particle field (canvas, no libraries) ---------- */
function initParticles(refs){
  const canvas = document.getElementById('particles');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, particles = [];

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight * 1.2;
  }
  function makeParticles(){
    const count = Math.min(70, Math.floor(w / 22));
    particles = Array.from({length: count}, () => ({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.6 + 0.4,
      vy: Math.random()*0.25 + 0.05,
      a: Math.random()*0.5 + 0.15,
      hue: Math.random() > 0.5 ? '34,211,238' : '76,141,255'
    }));
  }
  resize(); makeParticles();
  window.addEventListener('resize', () => { resize(); makeParticles(); });

  function draw(){
    ctx.clearRect(0,0,w,h);
    for (const p of particles){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.hue},${p.a})`;
      ctx.fill();
      if (!reduceMotion){
        p.y -= p.vy;
        if (p.y < -10) p.y = h + 10;
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
}
</script>
</body>
</html>
